<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>FleetOps — Fleet &amp; cross-border management</title>
  <meta name="theme-color" content="#15222C">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app"><div class="boot">Loading FleetOps…</div></div>
  <noscript>FleetOps needs JavaScript to run.</noscript>
  <script>
    // If the app has not started after 8s, the JS modules did not load (wrong folder, file:// or blocked CDN).
    setTimeout(function(){var b=document.querySelector('.boot');if(b)b.innerHTML='FleetOps did not start.<br>Open it from a web address (https://… or http://localhost), not by double-clicking the file, and make sure the <code>js</code> and <code>css</code> folders were uploaded next to index.html. Press F12 → Console to see the error.';},8000);
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
